name: Build Injective Binary

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cosmos-db
        uses: actions/checkout@v4

      - name: Install Go
        run: |
          wget -q https://go.dev/dl/go1.25.5.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.25.5.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Clone Injective
        run: git clone --branch v1.17.1 https://github.com/InjectiveFoundation/injective-core.git

      - name: Replace cosmos-db
        working-directory: injective-core
        run: |
          go mod edit -replace=github.com/cosmos/cosmos-db=..
          go mod tidy

      - name: Build
        working-directory: injective-core
        run: make install

      - name: Copy binaries
        run: |
          mkdir output
          cp ~/go/bin/injectived output/
          cp $(find ~/go/pkg/mod -name 'libwasmvm.x86_64.so' | head -1) output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: injective-${{ github.ref_name }}-${{ github.sha }}
          path: output/
